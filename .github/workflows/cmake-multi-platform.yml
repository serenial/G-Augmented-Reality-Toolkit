# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
      TOOLCHAIN_SCRIPT_SHA512: bfa9f07d8a024aa742eab81be4815156fec19f83aec35955cd8e559635f0503a481f6842ae65b6bd7d618a4dd177c1af9d9de4fa9f0fcf7f673263ae93c13239
      OPKG_UTILS_TAR_SHA512: 441ee5ed416c3565617ae5fc413846ebc53e33876f9cce5e721afef2b8d9cd68723231ea12c8a2effaba2ccb33a36dc6e180994a57e6871f34d671c03ab36b7b
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        arch: [x86, x64, armv7a]
        include:
          - os: windows-latest
            triplet_platform: windows
          - os: ubuntu-22.04
            triplet_platform: linux
        exclude:
        - os: ubuntu-22.04
          arch: x86
        - os: windows-latest
          arch: armv7a
        
    steps:
    - name: Restore vcpkg cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch }}-${{ matrix.triplet_platform}}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'shared-binary/**/CMakeLists.txt', 'vcpkg-overlay-ports/**/*.cmake', 'vcpkg-overlay-triplets/**/*.cmake') }}
        restore-keys: vcpkg-${{ matrix.arch }}-${{ matrix.triplet_platform}}

    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: lukka/get-cmake@latest
    - name: Install OS dependencies
      if: ${{ matrix.os == 'ubuntu-22.04' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential g++ python3 linux-libc-dev bison autoconf automake libtool pkg-config python3-jinja2 nasm libx11-dev libxft-dev libxext-dev libxi-dev  libxtst-dev python3-setuptools ninja-build gperf libdbus-1-dev libgl1-mesa-dev libgles2-mesa-dev libglu1-mesa-dev libudev-dev libx11-xcb-dev  libxcursor-dev  libxdamage-dev libxinerama-dev libxrandr-dev zip unzip tar curl autoconf-archive
    
    - name: Install Armv7a Cross Compilation Tools
      if: ${{ matrix.arch == 'armv7a' }}
      run: |
        curl https://download.ni.com/support/softlib/labview/labview_rt/2018/Linux%20Toolchains/linux/oecore-x86_64-core2-64-toolchain-6.0.sh -Lo install-tc.sh
        echo "${TOOLCHAIN_SCRIPT_SHA512} install-tc.sh" | sha512sum --check --status
        chmod +x ./install-tc.sh
        sudo ./install-tc.sh -y
        curl https://git.yoctoproject.org/opkg-utils/snapshot/opkg-utils-0.7.0.tar.gz -Lo opkg-utils.tar.gz
        echo "${OPKG_UTILS_TAR_SHA512} opkg-utils.tar.gz" | sha512sum --check --status
        mkdir /opkg-utils
        tar -zxf opkg-utils.tar.gz -C /opkg-utils --strip-components=1
        cd /opkg-utils
        make
        sudo make install

    - name: Setup VCPKG
      uses: lukka/run-vcpkg@v11

    - name: Run CMake consuming CMakePreset.json and run vcpkg to build packages
      uses: lukka/run-cmake@v10
      with:
          configurePreset: ci-${{ matrix.triplet_platform }}-${{ matrix.arch }}
          buildPreset: ci-${{ matrix.triplet_platform }}-${{ matrix.arch }}

    - name: Store Build Output
      uses: actions/upload-artifact@v4
      with:
        name: g_augmented_reality_${{ matrix.triplet_platform }}-${{ matrix.arch }}
        path: |
         ${{ github.workspace }}/bin
         ${{ github.workspace }}/build/vcpkg_installed/**/share

    - name: Save vcpkg cache
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch }}-${{ matrix.triplet_platform}}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'shared-binary/**/CMakeLists.txt', 'vcpkg-overlay-ports/**/*.cmake', 'vcpkg-overlay-triplets/**/*.cmake') }}
